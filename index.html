<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IdiotBox™</title>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* ==============================
           IDIOTBOX CONTROLLER
           ============================== */

        #controllerBox {
            background: white;
            width: 300px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        #controllerLabel {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #blockchainLabel {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        #walletStatus {
            margin-top: 10px;
            font-size: 16px;
        }

        /* ==============================
           BUTTONS
           ============================== */

        button {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #lockButton {
            background: #4CAF50;
            color: white;
        }

        #unlockButton {
            background: #f44336;
            color: white;
        }

        #resetButton {
            background: #2196F3;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==============================
           STATUS
           ============================== */

        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>IdiotBox™</h1>

    <div id="controllerBox">
        <div id="controllerLabel">IdiotBox Controller</div>

        <div id="blockchainLabel">
            Blockchain Command Control
        </div>
    </div>

    <button id="lockButton" onclick="authorizeAndSend('LOCK')">
        LOCK
    </button>

    <button id="unlockButton" onclick="authorizeAndSend('UNLOCK')">
        UNLOCK
    </button>

    <button id="resetButton" onclick="authorizeAndSend('RESET_IDIOTBOX_WIFI')">
        RESET_IDIOTBOX_WIFI
    </button>

    <div id="status">
        Ready.
    </div>


    <script>

        // ======================================================
        // IDIOTBOX SMART CONTRACT
        // ======================================================

        const contractAddress =
            "0x4e9B433d69585D55E8765b27FF593a203c6968F2";

        const contractABI = [
            "function issueCommand(uint8 command) public"
        ];


        // ======================================================
        // STATUS
        // ======================================================

        function updateStatus(message) {
            document.getElementById("status").innerText = message;
        }


        // ======================================================
        // SEND BLOCKCHAIN COMMAND
        // ======================================================

        async function authorizeAndSend(command) {

            try {

                // ------------------------------------------------
                // CHECK METAMASK
                // ------------------------------------------------

                if (!window.ethereum) {

                    updateStatus("❌ MetaMask is not installed.");

                    alert("MetaMask is not installed.");

                    return;
                }


                updateStatus("🦊 Opening MetaMask...");


                // ------------------------------------------------
                // CONNECT TO METAMASK
                // ------------------------------------------------

                const provider =
                    new ethers.BrowserProvider(
                        window.ethereum
                    );

                await provider.send(
                    "eth_requestAccounts",
                    []
                );


                // ------------------------------------------------
                // CHECK NETWORK
                // ------------------------------------------------

                const network =
                    await provider.getNetwork();

                if (network.chainId !== 11155111n) {

                    updateStatus(
                        "🔴 Switch MetaMask to Sepolia."
                    );

                    alert(
                        "Please switch MetaMask to the Sepolia Testnet."
                    );

                    return;
                }


                // ------------------------------------------------
                // GET SIGNER
                // ------------------------------------------------

                const signer =
                    await provider.getSigner();


                // ------------------------------------------------
                // CREATE CONTRACT
                // ------------------------------------------------

                const contract =
                    new ethers.Contract(
                        contractAddress,
                        contractABI,
                        signer
                    );


                // ------------------------------------------------
                // RESET WARNING
                // ------------------------------------------------

                if (command === "RESET_IDIOTBOX_WIFI") {

                    const confirmed = confirm(
                        "RESET_IDIOTBOX_WIFI will erase the ESP32's saved Wi-Fi credentials and restart the IdiotBox.\n\nContinue?"
                    );

                    if (!confirmed) {

                        updateStatus("Reset cancelled.");

                        return;
                    }
                }


                // ------------------------------------------------
                // COMMAND NUMBER
                // ------------------------------------------------

                let commandNumber;

                if (command === "LOCK") {

                    commandNumber = 0;

                }

                else if (command === "UNLOCK") {

                    commandNumber = 1;

                }

                else if (command === "RESET_IDIOTBOX_WIFI") {

                    commandNumber = 2;

                }

                else {

                    updateStatus("🔴 Unknown command.");

                    return;
                }


                // ------------------------------------------------
                // SEND TRANSACTION
                // ------------------------------------------------

                updateStatus(
                    "🦊 Approve " +
                    command +
                    " in MetaMask..."
                );

                const transaction =
                    await contract.issueCommand(
                        commandNumber
                    );


                console.log(
                    "Blockchain transaction:",
                    transaction.hash
                );


                updateStatus(
                    "⛓️ Waiting for blockchain confirmation..."
                );


                // ------------------------------------------------
                // WAIT FOR CONFIRMATION
                // ------------------------------------------------

                await transaction.wait();


                console.log(
                    "Blockchain transaction confirmed."
                );


                updateStatus(
                    "✅ " +
                    command +
                    " confirmed on Sepolia"
                );

            }


            // ======================================================
            // ERROR HANDLING
            // ======================================================

            catch (error) {

                console.error(
                    "Transaction error:",
                    error
                );

                if (
                    error.code === 4001 ||
                    error.code === "ACTION_REJECTED"
                ) {

                    updateStatus(
                        "❌ Transaction cancelled"
                    );

                }

                else {

                    updateStatus(
                        "❌ Transaction failed"
                    );
                }
            }
        }

    </script>

</body>
</html>
