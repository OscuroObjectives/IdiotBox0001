<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IdiotBox™</title>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* ==================================================
           WEIGHT DISPLAY
           ================================================== */

        #weightBox {
            background: white;
            width: 300px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        #weightLabel {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #weight {
            font-size: 48px;
            font-weight: bold;
        }

        #weightUnit {
            font-size: 22px;
        }

        #calibration {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        /* ==================================================
           BUTTONS
           ================================================== */

        button {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #extend {
            background: #4CAF50;
            color: white;
        }

        #retract {
            background: #f44336;
            color: white;
        }

        #stop {
            background: #555;
            color: white;
        }

        #tare {
            background: #2196F3;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================================================
           STATUS
           ================================================== */

        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        #scaleStatus {
            margin-top: 10px;
            font-size: 16px;
        }

    </style>
</head>

<body>
<body>

    <h1>IdiotBox™</h1>

    <div id="weightBox">
        <div id="weightLabel">IdiotBox Controller</div>

        <div id="calibration">
            Blockchain Command Control
        </div>

        <div id="scaleStatus">
            ⚪ Wallet not connected
        </div>
    </div>

    <button id="extend" onclick="authorizeAndSend('LOCK')">
        LOCK
    </button>

    <button id="retract" onclick="authorizeAndSend('UNLOCK')">
        UNLOCK
    </button>

    <button id="tare" onclick="authorizeAndSend('RESET_IDIOTBOX_WIFI')">
        RESET_IDIOTBOX_WIFI
    </button>

    <div id="status">
        Connecting...
    </div>

<script>

// ======================================================
// IDIOTBOX CONTRACT
// ======================================================

const contractAddress =
    "0x4e9B433d69585D55E8765b27FF593a203c6968F2";

const contractABI = [
    "function issueCommand(uint8 command) public",
    "event CommandIssued(uint256 indexed commandId, uint8 command, address indexed issuedBy)"
];

// Solidity enum:
// LOCK = 0
// UNLOCK = 1
// RESET_IDIOTBOX_WIFI = 2


// ======================================================
// STATUS
// ======================================================

function updateStatus(message) {
    document.getElementById("status").innerText = message;
}


// ======================================================
// META MASK + SOLIDITY
// ======================================================

async function authorizeAndSend(command) {

    try {

        // ----------------------------------------------
        // MAKE SURE METAMASK EXISTS
        // ----------------------------------------------

        if (!window.ethereum) {

            alert("MetaMask is not installed.");
            return;
        }


        updateStatus(
            "🦊 Opening MetaMask..."
        );


        // ----------------------------------------------
        // CONNECT TO METAMASK
        // ----------------------------------------------

        const provider =
            new ethers.BrowserProvider(
                window.ethereum
            );

        await provider.send(
            "eth_requestAccounts",
            []
        );


        // ----------------------------------------------
        // CHECK NETWORK
        // ----------------------------------------------

        const network =
            await provider.getNetwork();

        // Sepolia chain ID = 11155111
        if (network.chainId !== 11155111n) {

            updateStatus(
                "🔴 Switch MetaMask to Sepolia."
            );

            alert(
                "Please switch MetaMask to the Sepolia Testnet."
            );

            return;
        }


        // ----------------------------------------------
        // GET SIGNER
        // ----------------------------------------------

        const signer =
            await provider.getSigner();


        // ----------------------------------------------
        // CREATE CONTRACT
        // ----------------------------------------------

        const contract =
            new ethers.Contract(
                contractAddress,
                contractABI,
                signer
            );


        // ----------------------------------------------
        // RESET WARNING
        // ----------------------------------------------

        if (command === "RESET_IDIOTBOX_WIFI") {

            const confirmed = confirm(
                "RESET_IDIOTBOX_WIFI will erase the ESP32's saved Wi-Fi credentials and restart the IdiotBox.\n\nContinue?"
            );

            if (!confirmed) {
                updateStatus("Reset cancelled.");
                return;
            }
        }


        updateStatus(
            "🦊 Approve " +
            command +
            " in MetaMask..."
        );


        // ----------------------------------------------
        // CONVERT COMMAND TO ENUM NUMBER
        // ----------------------------------------------

        let commandNumber;

        if (command === "LOCK") {

            commandNumber = 0;

        }

        else if (command === "UNLOCK") {

            commandNumber = 1;

        }

        else if (command === "RESET_IDIOTBOX_WIFI") {

            commandNumber = 2;

        }

        else {

            updateStatus("🔴 Unknown command.");
            return;
        }


        // ----------------------------------------------
        // CALL SOLIDITY CONTRACT
        // ----------------------------------------------

        const transaction =
            await contract.issueCommand(
                commandNumber
            );


        console.log(
            "Blockchain transaction:",
            transaction.hash
        );


        updateStatus(
            "⛓️ Waiting for blockchain confirmation..."
        );


        // ----------------------------------------------
        // WAIT FOR SEPOLIA CONFIRMATION
        // ----------------------------------------------

        await transaction.wait();


        console.log(
            "Blockchain transaction confirmed."
        );


        // ----------------------------------------------
        // COMPLETE
        // ----------------------------------------------

        updateStatus(
            "✅ " +
            command +
            " confirmed on Sepolia"
        );

    }

    catch (error) {

        console.error(error);

        updateStatus(
            "❌ Transaction cancelled or failed"
        );
    }
}

</script>

</body>
</html>
